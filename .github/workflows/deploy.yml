name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Policy scan (advisory)
        continue-on-error: true
        run: checkov -d . --soft-fail --skip-check CKV_AWS_18,CKV_AWS_144
      - run: terraform init && terraform apply -auto-approve
